<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Web Output #3</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        button {
            padding: 5 10px;
            margin-right: 5px;
            cursor: pointer;
            border: 1px solid #777;
            background-color: #f5f5f5;
            border-radius: 3px;
        }

        button:hover {
            background-color: #ddd;
        }

        a {
            color: blue;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #eee;
        }

        .completed {
            color: green;
            font-weight: bold;
        }

        .not-completed {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Javascript Web Output #3</h1>

    <button id="loadBtn">Load data from the API</button>
    <button id="clearBtn">Clear Table</button>

    <p>
        API:
        <a href="https://jsonplaceholder.typicode.com/todos/" target="_blank">
            https://jsonplaceholder.typicode.com/todos/
        </a>
    </p>

    <div id="tableContainer"></div>

    <script src="main.js"></script>

</body>
</html>
